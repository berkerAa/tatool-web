services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_dev
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always
  tatool-web:
    build: .
    container_name: tatool_app
    ports:
      - "3000:3000"
    environment:
      # We tell the app to look for 'mongodb' instead of 'localhost'
      - MONGODB_URI=mongodb://mongodb:27017/tatool
      - NODE_ENV=development
    depends_on:
      - mongodb
    restart: always
volumes:
  mongo_data:
